<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#0f172a"/>
  <title>Sem conexão — Portal CBA</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0f172a;color:#f8fafc;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:100%;max-width:430px;padding:32px 25px;border:1px solid #344158;border-radius:24px;background:#18263b;text-align:center}
    img{width:72px;height:72px}h1{font-size:24px;margin:20px 0 8px}p{color:#cbd5e1;line-height:1.55}
    button{margin-top:12px;border:0;border-radius:12px;background:#e75155;color:#fff;padding:14px 22px;font-size:15px;font-weight:750;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <img src="/icon-192x192.png" alt="Logo Portal CBA"/>
    <h1>Você está sem conexão</h1>
    <p>Para proteger os dados dos atletas, as informações e súmulas do CBA não ficam salvas para consulta offline. Reconecte-se para continuar.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>

name: CBA - testes e build
on:
  push:
    branches:
      - main
      - fix/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Testes React
        run: CI=true npm test -- --watch=false --runInBand
      - name: Testes backend
        run: npm run test:backend
      - name: Build de produção
        run: npm run build
